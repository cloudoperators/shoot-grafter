name: Cut Chart Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  cut-chart-release:
    uses: cloudoperators/common/.github/workflows/shared-release.yaml@main
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump }}
      chart-path: charts/shoot-grafter/Chart.yaml
      chart-only: true
      environment: release
    secrets:
      release-token: ${{ secrets.RELEASE_GH_TOKEN_PR }}

name: Helm Chart Publish

on:
  push:
    tags:
      - "helm-chart-*.*.*"
    paths:
      - 'charts/**'

jobs:
  helm-release:
    uses: cloudoperators/common/.github/workflows/shared-helm-release.yaml@4a36aa4e13e96d49b6d17f29da005f6cdb42b15b
    permissions:
      contents: read
      packages: write
    with:
      chart-dir: charts/shoot-grafter
      chart-name: shoot-grafter

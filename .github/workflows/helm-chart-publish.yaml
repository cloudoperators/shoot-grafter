name: Helm Chart Publish

on:
  push:
    tags:
      - "helm-chart-*.*.*"
    paths:
      - 'charts/**'

jobs:
  helm-release:
    uses: cloudoperators/common/.github/workflows/shared-helm-release.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      chart-dir: charts/shoot-grafter
      chart-name: shoot-grafter

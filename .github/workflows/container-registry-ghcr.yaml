name: Container Registry GHCR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  docker-release:
    uses: cloudoperators/common/.github/workflows/shared-docker-release.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      image-name: ghcr.io/cloudoperators/shoot-grafter
